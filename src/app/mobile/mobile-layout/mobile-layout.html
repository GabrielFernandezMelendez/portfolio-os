<div class="mobile-shell" [class.light]="!isDark()">
  <app-mobile-background [isDark]="isDark()" [paused]="golPaused()" />

  <app-mobile-status-bar [isDark]="isDark()" (onSwipeDown)="openNotifications()">
  </app-mobile-status-bar>

  <div class="mobile-viewport" (touchstart)="onSwipeStart($event)" (touchend)="onSwipeEnd($event)">
    @if (mobileView() === 'home') {
<app-mobile-home
  [pages]="pages()"
  [currentPage]="currentPage()"
  [isDark]="isDark()"
  (onOpenApp)="openApp($event)"
  (onPageChange)="goToPage($event)"
  (onAddPage)="addPage()"
  (onMoveAppToPage)="moveAppToPage($event)"
  (onMoveAppToNewPage)="moveAppToNewPage($event)"
  (onCreateFolder)="createFolder($event.app1, $event.app2, $event.pageId)"
  (onAddAppToFolder)="addAppToFolder($event.app, $event.folderId, $event.fromPageId)"
  (onRenameFolder_emit)="renameFolder($event.folderId, $event.newName)">
</app-mobile-home>
    }

    @if (activeApp()) {
      <app-mobile-app-view
        [appId]="activeApp()!"
        [isDark]="isDark()"
        [class.hidden-view]="mobileView() !== 'app'"
      >
      </app-mobile-app-view>
    }

    @if (mobileView() === 'recents') {
      <app-mobile-recents
        [openedApps]="openedApps()"
        [isDark]="isDark()"
        (onResume)="resumeApp($event)"
        (onClose)="closeApp($event)"
        (onCloseAll)="openedApps.set([]); mobileView.set('home')"
      >
      </app-mobile-recents>
    }

    @if (mobileView() === 'notifications') {
      <app-notification-panel
        [isDark]="isDark()"
        [golPaused]="golPaused()"
        (onClose)="closeNotifications()"
        (onToggleTheme)="toggleTheme()"
        (onToggleGol)="toggleGol()"
        (onOpenSettings)="openSettings()"
      >
      </app-notification-panel>
    }
  </div>

  <app-mobile-navbar
    [isDark]="isDark()"
    [activeView]="mobileView()"
    (onBack)="goBack()"
    (onHome)="goHome()"
    (onRecents)="goRecents()"
  >
  </app-mobile-navbar>
</div>
